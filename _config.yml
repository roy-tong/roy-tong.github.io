title: "Roy.Tong"
tagline: "研究 AI 如何变成产品、系统与商业"
description: "Roy Tong 的个人博客，记录 AI、具身智能、产品与创业的观察、研究和开放项目。"
url: "https://roy-tong.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
logo: /assets/images/social-preview.png
image: /assets/images/social-preview.png

author:
  name: "Roy.Tong"
  github: roy-tong

social:
  name: "Roy.Tong"
  links:
    - https://github.com/roy-tong
    - https://x.com/elliwoodtong

permalink: /notes/:title/
markdown: kramdown
collections:
  materials:
    output: true
    permalink: /knowledge/materials/:name/
  knowledge:
    output: true
    permalink: /knowledge/:name/
defaults:
  - scope:
      path: ""
      type: materials
    values:
      layout: research-material
      lang: zh-CN
      knowledge_page: true
      publication_status: public
  - scope:
      path: ""
      type: knowledge
    values:
      layout: knowledge
      lang: zh-CN
      knowledge_page: true
      status: evolving
      resource_type: note
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - README.md
  - LICENSE
  - PRODUCT.md
  - DESIGN.md
  - vendor
  - scripts
  - tests
  - docs
  - .impeccable
