<section class="not-found shell">
  <p class="error-code">404</p>
  <h1>找不到这个页面。</h1>
  <p>链接可能有误，或者页面地址已经变更。</p>
  <a class="button primary" href="{{ '/' | relative_url }}">返回首页</a>

<script>
  // The old project path is gone after the repository rename; send deep links
  // (/AgentMeasure/tools.html and friends) to the new site instead of a 404.
  (function () {
    var p = location.pathname;
    if (p === "/AgentMeasure" || p.indexOf("/AgentMeasure/") === 0) {
      var rest = p.replace(/^\/AgentMeasure\/?/, "");
      location.replace("https://roy-tong.github.io/verovo/" + rest + location.search + location.hash);
    }
  })();
</script>
